<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    form {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <form action="/signup" method="POST" autocomplete="on" novalidate>
    
    <h2 title="Account" style="text-align: center;">Create Account</h2>
    
    <!-- Full Name -->
    <label for="fullname">Full Name</label>
    <input
      type="text"
      id="fullname"
      name="fullname"
      placeholder="Enter your full name"
      required
      minlength="3"
    />

    <!-- Email -->
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="example@email.com"
      required
    />

    <!-- Password -->
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      minlength="6"
    />

    <!-- Age -->
    <label for="age">Age</label>
    <input
      type="number"
      id="age"
      name="age"
      min="13"
      max="100"
    />

    <!-- Gender -->
    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="">Select</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>

    <!-- Bio -->
    <label for="bio">Bio</label>
    <textarea
      id="bio"
      name="bio"
      rows="4"
      placeholder="Tell something about yourself"
    ></textarea>

    <!-- Terms -->
    <label>
      <input type="checkbox" name="terms" required />
      I agree to the terms and conditions
    </label>

    <!-- Submit -->
    <button type="submit">Sign Up</button>

  </form>

</body>
</html>
